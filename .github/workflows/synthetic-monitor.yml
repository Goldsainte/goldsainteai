name: Synthetic Monitor (prod smoke)

# Phase 0 of the QA program (Aug 7 2026): an hourly READ-ONLY smoke run
# against the live site. It navigates key pages and asserts:
#   - no uncaught JS exceptions, no unexpected console errors
#   - no horizontal overflow (desktop + mobile viewports)
#   - the Goldsainte Verified badge pipeline is intact end-to-end
#   - the Supabase REST platform answers correctly
# It never signs up, never submits forms, never touches Stripe. Write-path
# journeys (account creation, subscriptions) are Phase 1 and run on staging.
#
# Alerting: GitHub emails the workflow's committer when a scheduled run fails.
# Check the Actions tab for traces + screenshots attached to failed runs.

on:
  schedule:
    # Hourly, at :17 past (offset avoids GitHub's congested top-of-hour cron slot).
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Override target (e.g. https://goldsainte-prod.pages.dev to validate a cutover candidate). Default: live prod.'
        required: false
        default: 

concurrency:
  group: synthetic-monitor
  cancel-in-progress: true

jobs:
  smoke:
    name: Prod smoke (read-only)
    runs-on: ubuntu-latest
    # 30, not 15: the suite grew from 12 anonymous checks to 25+ including
    # nine full UI sign-ins across three engines (Aug 8) — the old cap was
    # killing healthy runs mid-flight ("operation was canceled").
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # `npm install`, not `npm ci`: package.json and package-lock.json have
        # drifted (deps added without regenerating the lock — first monitor run,
        # Aug 7, caught it), and strict-mode ci refuses drift. A monitor doesn't
        # need reproducible builds, just a working Playwright. Regenerate the
        # lockfile properly once the repo has a local git workflow, then this
        # can return to `npm ci`.
        run: npm install --no-audit --no-fund

      - name: Install Playwright (Chromium + WebKit)
        # WebKit added Aug 8 (Phase 3): the safari project catches
        # Safari-specific quirks the Chromium projects can't see.
        run: npx playwright install --with-deps chromium webkit

      - name: Run prod smoke suite
        # PROD_MONITOR_* unlock the logged-in checks (Phase 3): a dedicated
        # real prod account, read-only pages only. Absent secrets = those
        # checks self-skip and the anonymous suite runs as before.
        env:
          PROD_MONITOR_EMAIL: ${{ secrets.PROD_MONITOR_EMAIL }}
          PROD_MONITOR_PASSWORD: ${{ secrets.PROD_MONITOR_PASSWORD }}
          PROD_MONITOR_CREATOR_EMAIL: ${{ secrets.PROD_MONITOR_CREATOR_EMAIL }}
          PROD_MONITOR_CREATOR_PASSWORD: ${{ secrets.PROD_MONITOR_CREATOR_PASSWORD }}
          PROD_MONITOR_AGENT_EMAIL: ${{ secrets.PROD_MONITOR_AGENT_EMAIL }}
          PROD_MONITOR_AGENT_PASSWORD: ${{ secrets.PROD_MONITOR_AGENT_PASSWORD }}
          PLAYWRIGHT_BASE_URL: ${{ github.event.inputs.target_url }}
        run: npx playwright test --config=playwright.prod.config.ts

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          echo "## Synthetic monitor — prod smoke" >> $GITHUB_STEP_SUMMARY
          echo "Target: \`${PLAYWRIGHT_BASE_URL:-https://goldsainte.ai}\`" >> $GITHUB_STEP_SUMMARY
          echo "Result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
