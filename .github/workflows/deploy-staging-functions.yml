name: Deploy Staging Functions

# Phase 1: deploys ALL edge functions (same code as prod) to the STAGING
# Supabase project. Manual trigger only — staging function code follows main,
# so re-run this after backend changes land, same habit as prod's
# deploy-supabase workflow.
#
# The functions read their configuration (Stripe test keys, staging URLs,
# webhook secrets) from the STAGING project's Edge Function secrets — set in
# that project's dashboard, never in this repo. Secrets are read at function
# boot: after changing any staging secret, re-run this workflow (same rule as
# prod, pitfall P7).
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN          (already exists — org-wide token)
#   STAGING_SUPABASE_PROJECT_REF   (already exists)

on:
  workflow_dispatch: {}

concurrency:
  group: deploy-staging-functions
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy:
    name: Deploy functions to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Guard — secrets must exist
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::STAGING_SUPABASE_PROJECT_REF / SUPABASE_ACCESS_TOKEN not set"; exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      # No `supabase link` — same reasoning as the prod workflow (Aug 7):
      # functions deploy authenticates via SUPABASE_ACCESS_TOKEN and targets
      # the project with --project-ref; link's api-key fetch is both
      # unnecessary and currently broken platform-side.

      - name: Deploy edge functions to staging
        # esm.sh occasionally times out mid-bundle (HTTP 522) — transient;
        # retry up to 3 times before declaring a real failure.
        run: |
          for attempt in 1 2 3; do
            if supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"; then
              exit 0
            fi
            echo "::warning::Deploy attempt $attempt failed — retrying in 45s (transient CDN errors are common)"
            sleep 45
          done
          echo "::error::Deploy failed 3 times — likely a real problem, not a flake"
          exit 1

      - name: Summary
        if: success()
        run: |
          echo "## Staging functions deployed" >> $GITHUB_STEP_SUMMARY
          echo "Project: staging (\`$SUPABASE_PROJECT_REF\`)" >> $GITHUB_STEP_SUMMARY
          echo "Reminder: staging function secrets are read at boot — re-run this after changing them." >> $GITHUB_STEP_SUMMARY
